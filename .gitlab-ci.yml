# hgyjy-product-toolkit 流水线
# - validate: 每次推送跑 manifest/版本/本地化校验
# - package:  打 v* tag 时打包 .kplugin 并创建 GitLab Release（制品附加）
#
# 发布流程：改 kimi.plugin.json 的 version → git tag v<x.y.z> → push tag
# → CI 打包出 hgyjy-product-toolkit-<version>.kplugin → 用 Kimi 的
#   publish_user_plugin 发布该 .kplugin，插件页「版本历史」选择切换。

stages:
  - validate
  - package

validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 ci/validate.py

package:
  stage: package
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - python3 ci/validate.py
    - VERSION=$(python3 -c "import json; print(json.load(open('kimi.plugin.json'))['version'])")
    - mkdir -p dist
    # .kplugin 即 zip 包：manifest + locales + skills，文件位于压缩包根部
    # （发布平台要求 kimi.plugin.json 在根），排除仓库与 CI 自身文件
    - zip -r "dist/hgyjy-product-toolkit-${VERSION}.kplugin" . -x ".git/*"
      "ci/*" ".gitlab-ci.yml" "dist/*" "README.md"
    - unzip -l "dist/hgyjy-product-toolkit-${VERSION}.kplugin"
  artifacts:
    paths:
      - dist/*.kplugin
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "hgyjy-product-toolkit v${VERSION} —— 故事地图×旅程图双件套"
    assets:
      links:
        - name: "hgyjy-product-toolkit.kplugin"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/hgyjy-product-toolkit-${VERSION}.kplugin"
