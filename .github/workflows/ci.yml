# hgyjy-product-toolkit GitHub Actions 流水线
# - validate: 每次推送/PR 跑 manifest/版本/本地化校验
# - release:  打 v* tag 时打包 .kplugin 并创建 GitHub Release（制品附加）
#
# 发布流程：改 kimi.plugin.json 的 version → git tag v<x.y.z> → push tag
# → CI 打包出 hgyjy-product-toolkit-<version>.kplugin → 用 Kimi 的
#   publish_user_plugin 发布该 .kplugin，插件页「版本历史」选择切换。
# 与 .gitlab-ci.yml 行为对齐；校验脚本复用 ci/validate.py（CI_COMMIT_TAG
# 环境变量在 GitLab 原生提供，GitHub 侧用 github.ref_name 注入）。

name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验 manifest/版本/本地化
        run: python3 ci/validate.py

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验（tag 与 manifest 版本一致性）
        run: python3 ci/validate.py
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
      - name: 打包 .kplugin
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('kimi.plugin.json'))['version'])")
          mkdir -p dist
          # .kplugin 即 zip 包：manifest + locales + skills，文件位于压缩包根部，
          # 排除仓库/CI/文档自身（与已发布的 .kplugin 结构一致）
          zip -r "dist/hgyjy-product-toolkit-${VERSION}.kplugin" . \
            -x ".git/*" ".github/*" "ci/*" ".gitlab-ci.yml" "README.md" "dist/*"
          unzip -l "dist/hgyjy-product-toolkit-${VERSION}.kplugin"
      - name: 创建 GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" dist/*.kplugin \
            --title "hgyjy-product-toolkit ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
